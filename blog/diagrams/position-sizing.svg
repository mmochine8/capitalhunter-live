<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Position sizing">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >Position sizing</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >Size from risk, not gut feel</text>
  
    <rect x="60" y="110" width="760" height="90" rx="10" fill="#141414" stroke="#242424" stroke-width="1" />
    <text x="84" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" >Risk per trade  =  Account × Risk %</text>
    <text x="84" y="182" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start" >$500  =  $50,000 × 1%</text>
    <rect x="60" y="220" width="760" height="90" rx="10" fill="#141414" stroke="#242424" stroke-width="1" />
    <text x="84" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start" >Size  =  Risk $  ÷  (Stop distance × value per unit)</text>
    <text x="84" y="292" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start" >2.5 lots  =  $500 ÷ (20 pips × $10)</text>
    <rect x="60" y="360" width="355.6" height="22" rx="11" fill="#ffffff" opacity="0.15"/><text x="71" y="375" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start" >Same risk every trade keeps drawdown predictable</text>
</svg>