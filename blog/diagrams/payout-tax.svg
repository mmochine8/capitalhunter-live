<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Funded payouts and tax">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >Funded payouts and tax</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >Usually paid gross (no tax withheld) — set some aside yourself</text>
  
    <rect x="90" y="150" width="700" height="70" rx="10" fill="#555555" stroke="none" stroke-width="1" opacity="0.25"/>
    <rect x="90" y="150" width="210" height="70" rx="10" fill="#d72f2f" stroke="none" stroke-width="1" opacity="0.85"/>
    <text x="195" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >Set aside ~30%</text>
    <text x="545" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#8c8c8c" text-anchor="middle" >Keep 70%</text>
    <text x="90" y="270" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start" >Example: on a $2,000 payout, parking ~$600 covers most tax bills.</text>
    <text x="90" y="298" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#8c8c8c" text-anchor="start" >Rates vary by country and income — not tax advice. Keep records; consider a pro.</text>
</svg>