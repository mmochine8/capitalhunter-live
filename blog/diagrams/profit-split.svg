<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Profit split">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >Profit split</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >You keep 80% of profits — the firm keeps the rest</text>
  
    <rect x="90" y="150" width="700" height="70" rx="10" fill="#555555" stroke="none" stroke-width="1" opacity="0.25"/>
    <rect x="90" y="150" width="560" height="70" rx="10" fill="#d72f2f" stroke="none" stroke-width="1" opacity="0.85"/>
    <text x="370" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" >You 80%</text>
    <text x="720" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#8c8c8c" text-anchor="middle" >Firm 20%</text>
    <text x="90" y="270" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#ffffff" text-anchor="start" >Example: $5,000 profit at an 80% split = $4,000 to you.</text>
    <text x="90" y="298" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#8c8c8c" text-anchor="start" >Splits often scale up (to 90%+) as you take more payouts.</text>
</svg>