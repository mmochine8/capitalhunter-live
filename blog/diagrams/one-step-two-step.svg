<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="1-step vs 2-step evaluations">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >1-step vs 2-step evaluations</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >Fewer phases = faster, but often tighter rules</text>
  
    <rect x="60" y="150" width="360" height="200" rx="12" fill="#141414" stroke="#242424" stroke-width="1" />
    <text x="84" y="190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start" >1-Step</text>
    <text x="84" y="224" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• One profit target</text>
    <text x="84" y="250" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Faster to funded</text>
    <text x="84" y="276" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Often tighter drawdown</text>
    <text x="84" y="302" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Higher price</text>
    <rect x="460" y="150" width="360" height="200" rx="12" fill="#141414" stroke="#242424" stroke-width="1" />
    <text x="484" y="190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#8c8c8c" text-anchor="start" >2-Step</text>
    <text x="484" y="224" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Challenge + Verification</text>
    <text x="484" y="250" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• More room / cheaper</text>
    <text x="484" y="276" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Takes longer</text>
    <text x="484" y="302" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Two targets to hit</text>
</svg>