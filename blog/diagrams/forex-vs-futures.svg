<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Forex vs futures prop firms">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >Forex vs futures prop firms</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >Different markets, platforms and rules</text>
  <rect x="50" y="100" width="780" height="62" rx="0" fill="#141414" stroke="none" stroke-width="1" /><text x="326" y="138" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#8c8c8c" text-anchor="start" >Forex / CFD</text><text x="586" y="138" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#d72f2f" text-anchor="start" >Futures</text><text x="66" y="200" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#8c8c8c" text-anchor="start" >Markets</text><text x="326" y="200" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >FX, indices, metals</text><text x="586" y="200" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >Index, energy, commodity futures</text><rect x="50" y="224" width="780" height="62" rx="0" fill="#101010" stroke="none" stroke-width="1" /><text x="66" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#8c8c8c" text-anchor="start" >Platforms</text><text x="326" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >MT4 / MT5 / cTrader</text><text x="586" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >Tradovate / NinjaTrader / Rithmic</text><text x="66" y="324" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#8c8c8c" text-anchor="start" >Drawdown</text><text x="326" y="324" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >often static %</text><text x="586" y="324" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >often trailing / EOD</text><rect x="50" y="348" width="780" height="62" rx="0" fill="#101010" stroke="none" stroke-width="1" /><text x="66" y="386" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#8c8c8c" text-anchor="start" >Extra fees</text><text x="326" y="386" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >usually none</text><text x="586" y="386" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="start" >activation + data fees</text><line x1="310" y1="100" x2="310" y2="410" stroke="#242424" stroke-width="1" /><line x1="570" y1="100" x2="570" y2="410" stroke="#242424" stroke-width="1" /><rect x="50" y="100" width="780" height="310" rx="10" fill="none" stroke="#242424" stroke-width="1" />
