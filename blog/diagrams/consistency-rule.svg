<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="The consistency rule">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >The consistency rule</text>
