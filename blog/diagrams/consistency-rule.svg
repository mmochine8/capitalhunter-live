    <rect x="70" y="331.2" width="70" height="28.799999999999997" rx="4" fill="#8c8c8c" stroke="none" stroke-width="1" opacity="0.55"/><text x="105" y="380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8c8c8c" text-anchor="middle" >Day 1</text><text x="105" y="323.2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" >$300</text><rect x="188" y="316.8" width="70" height="43.199999999999996" rx="4" fill="#8c8c8c" stroke="none" stroke-width="1" opacity="0.55"/><text x="223" y="380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8c8c8c" text-anchor="middle" >Day 2</text><text x="223" y="308.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" >$450</text><rect x="306" y="336" width="70" height="24" rx="4" fill="#8c8c8c" stroke="none" stroke-width="1" opacity="0.55"/><text x="341" y="380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8c8c8c" text-anchor="middle" >Day 3</text><text x="341" y="328" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" >$250</text><rect x="424" y="120" width="70" height="240" rx="4" fill="#d72f2f" stroke="none" stroke-width="1" opacity="1"/><text x="459" y="380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8c8c8c" text-anchor="middle" >Day 4</text><text x="459" y="112" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#d72f2f" text-anchor="middle" >$2,500</text><rect x="542" y="321.6" width="70" height="38.4" rx="4" fill="#8c8c8c" stroke="none" stroke-width="1" opacity="0.55"/><text x="577" y="380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8c8c8c" text-anchor="middle" >Day 5</text><text x="577" y="313.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" >$400</text><rect x="660" y="331.2" width="70" height="28.799999999999997" rx="4" fill="#8c8c8c" stroke="none" stroke-width="1" opacity="0.55"/><text x="695" y="380" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#8c8c8c" text-anchor="middle" >Day 6</text><text x="695" y="323.2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" >$300</text>
    <line x1="60" y1="360" x2="820" y2="360" stroke="#555555" stroke-width="1" />
    <text x="70" y="420" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#d72f2f" text-anchor="start" >Best day $2,500 = 60% of $4,200 total → over a 30% limit ✗</text>
    <text x="70" y="446" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#8c8c8c" text-anchor="start" >Trade more days to dilute the big day below the cap.</text>
