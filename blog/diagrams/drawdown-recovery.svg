<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Why losses hurt more than they look">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >Why losses hurt more than they look</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >The gain needed to recover grows faster than the loss</text>
  
    <text x="60" y="154" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#d72f2f" text-anchor="end" >−10%</text><rect x="90" y="138" width="39.96" height="30" rx="4" fill="#ffffff" stroke="none" stroke-width="1" opacity="0.8"/><text x="139.96" y="158" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" >needs +11.1%</text><text x="60" y="218" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#d72f2f" text-anchor="end" >−25%</text><rect x="90" y="202" width="119.87999999999998" height="30" rx="4" fill="#ffffff" stroke="none" stroke-width="1" opacity="0.8"/><text x="219.88" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" >needs +33.3%</text><text x="60" y="282" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#d72f2f" text-anchor="end" >−50%</text><rect x="90" y="266" width="360" height="30" rx="4" fill="#ffffff" stroke="none" stroke-width="1" opacity="0.8"/><text x="460" y="286" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" >needs +100%</text><text x="60" y="346" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#d72f2f" text-anchor="end" >−60%</text><rect x="90" y="330" width="540" height="30" rx="4" fill="#ffffff" stroke="none" stroke-width="1" opacity="0.8"/><text x="640" y="350" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" >needs +150%</text>
    <rect x="90" y="410" width="463.6" height="22" rx="11" fill="#d72f2f" opacity="0.15"/><text x="101" y="425" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#d72f2f" text-anchor="start" >Lose 50% and you need to double what is left just to break even</text>
</svg>