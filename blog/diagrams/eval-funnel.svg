<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="How a prop firm evaluation works">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >How a prop firm evaluation works</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >Most traders drop out at each stage — the funnel narrows</text>
  <rect x="60" y="110" width="760" height="56" rx="8" fill="#d72f2f" stroke="#d72f2f" stroke-width="1" opacity="0.08"/><text x="78" y="136" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" >1. Challenge</text><text x="78" y="156" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8c8c8c" text-anchor="start" >hit profit target, stay in rules</text><text x="812" y="184" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >▼</text><rect x="105" y="192" width="670" height="56" rx="8" fill="#d72f2f" stroke="#d72f2f" stroke-width="1" opacity="0.14"/><text x="123" y="218" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" >2. Verification</text><text x="123" y="238" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8c8c8c" text-anchor="start" >prove it again (2-step firms)</text><text x="812" y="266" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >▼</text><rect x="150" y="274" width="580" height="56" rx="8" fill="#d72f2f" stroke="#d72f2f" stroke-width="1" opacity="0.2"/><text x="168" y="300" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" >3. Funded account</text><text x="168" y="320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8c8c8c" text-anchor="start" >trade the firm capital</text><text x="812" y="348" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >▼</text><rect x="195" y="356" width="490" height="56" rx="8" fill="#d72f2f" stroke="#d72f2f" stroke-width="1" opacity="0.26"/><text x="213" y="382" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start" >4. Payout</text><text x="213" y="402" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8c8c8c" text-anchor="start" >meet min days + buffer, withdraw</text>
</svg>