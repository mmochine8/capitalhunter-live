<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Reset vs new account after a fail">
  <rect x="0" y="0" width="880" height="470" rx="16" fill="#080808" stroke="#242424" stroke-width="1" />
  <text x="32" y="46" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start" >Reset vs new account after a fail</text>
  <text x="32" y="70" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >Two ways back in — different cost and progress</text>
  
    <rect x="60" y="140" width="360" height="210" rx="12" fill="#141414" stroke="#242424" stroke-width="1" />
    <text x="84" y="180" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#d72f2f" text-anchor="start" >Reset</text>
    <text x="84" y="214" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Same account, wiped to start</text>
    <text x="84" y="240" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Pay a reset fee (often &lt; new)</text>
    <text x="84" y="266" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Keep your login / dashboard</text>
    <text x="84" y="292" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Progress wiped back to zero</text>
    <rect x="460" y="140" width="360" height="210" rx="12" fill="#141414" stroke="#242424" stroke-width="1" />
    <text x="484" y="180" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start" >New account</text>
    <text x="484" y="214" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Buy a fresh evaluation</text>
    <text x="484" y="240" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Full price (use a discount)</text>
    <text x="484" y="266" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Clean slate, new credentials</text>
    <text x="484" y="292" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#8c8c8c" text-anchor="start" >• Sometimes a better promo</text>
    <rect x="60" y="400" width="578.8000000000001" height="22" rx="11" fill="#d72f2f" opacity="0.15"/><text x="71" y="415" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#d72f2f" text-anchor="start" >Reset usually wins on price — compare the reset fee to a discounted new account</text>
</svg>